BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "balena-imx9"
BBFILE_PATTERN_balena-imx9 := "^${LAYERDIR}/"
BBFILE_PRIORITY_balena-imx9 = "1337"
LAYERSERIES_COMPAT_balena-imx9 = "scarthgap"

BBMASK += "meta-imx/meta-imx-bsp/recipes-connectivity/connman/"
BBMASK += "meta-imx/meta-imx-bsp/recipes-multimedia/pipewire/"
BBMASK += "meta-imx/meta-imx-bsp/recipes-multimedia/wireplumber/"
BBMASK += "meta-bsp-imx9/recipes-fsl/images/"
BBMASK += "meta-bsp-imx9/recipes-desktop/cl-deploy/"
BBMASK += "recipes-bsp/firmware-imx/firmware-ele-imx_1.3.0.bbappend"

# remove unused bbappends because they don't match anymore with the versions in the updated layers
BBMASK += "meta-imx/meta-imx-bsp/recipes-connectivity/openssl/openssl_3.2.%.bbappend"

# Work around meta-freescale/conf/machine/include/imx-base.inc setting
# "SECOEXT_FIRMWARE_NAME ?= ''" before meta-imx-bsp's imx-base-extend.inc
# gets a chance to weak-default it to "UNDEFINED". For mx91/mx93 (which
# don't define their own SECOEXT_FIRMWARE_NAME:<override>) this leaves the
# variable empty, so firmware-ele-imx_1.3.0.bb's do_install ends up testing
# "-e ${S}/" (always true) and then tries to `install` the recipe's source
# directory itself, failing with "install: omitting directory".
SECOEXT_FIRMWARE_NAME:mx91-generic-bsp ?= "UNDEFINED"
SECOEXT_FIRMWARE_NAME:mx93-generic-bsp ?= "UNDEFINED"

#KERNEL_IMAGETYPE:compulab-mx93 = "Image.gz"
KERNEL_PACKAGE_NAME="kernel"

HOSTTOOLS:remove = " git-lfs "
HOSTTOOLS:remove = " bison "

MACHINE_FEATURES:remove = "optee"

KERNEL_IMAGETYPE:iot-link = "Image.gz"
